server.port=${PORT:8081}
server.address=0.0.0.0
server.error.include-message=always
server.error.include-binding-errors=always
spring.jackson.serialization.fail-on-empty-beans=false

spring.application.name=vocaboo-backend
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties,optional:file:.env,optional:file:backend/.env

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── HikariCP Connection Pool ───────────────────────────────────────────────
# Supabase free tier limits to 15 connections total. Keep pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
# Disable open-in-view to free up DB connection during startup
spring.jpa.open-in-view=false


spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
# Allow startup against the existing database history while migration files are being reconciled.
spring.flyway.validate-on-migrate=false
GEMINI_API_KEY=AIzaSyD0eXeKX-9mv0aBCtFCeJa54RVWQ01hk7M
app.jwt.secret=${JWT_SECRET:vocaboo_super_secret_signing_key_must_be_long_enough_to_meet_security_requirements} 
# Access token: 15 minutes (was 24h — refresh token handles long sessions)
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days stored in DB
app.jwt.refresh-token-expiration-days=7

# Admin panel base URL (used in password reset email links)
# Change to https://your-deployed-domain.com when deploying to production
app.admin.base-url=${ADMIN_BASE_URL:http://localhost:5173}

