# ── File Upload / Asset Storage (Phase 2) ─────────────────────────────────
# Local directory for uploaded audio and image files
vocaboo.uploads.dir=${UPLOADS_DIR:uploads}
# Base URL used to generate public asset URLs
vocaboo.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8081/uploads}
# Max file sizes for multipart uploads
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB



