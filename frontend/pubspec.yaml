name: vocaboo
description: "Vocaboo - Cebuano Mother Tongue-First Vocabulary App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.0.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/json/phonological_tips.json
